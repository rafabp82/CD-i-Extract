name: Build Windows EXE (Cross-compile with Boost and libpng)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW-w64 and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake wget

    - name: Download and Build Boost for MinGW
      run: |
        wget -q https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz
        tar -xzf boost_1_84_0.tar.gz
        cd boost_1_84_0
        ./bootstrap.sh --with-toolset=gcc
        sudo ./b2 toolset=gcc --prefix=/usr/x86_64-w64-mingw32 --with-system --with-filesystem install
        ls /usr/x86_64-w64-mingw32/include/boost/format.hpp

    - name: Download and Build libpng for MinGW
      run: |
        wget -q https://download.sourceforge.net/libpng/libpng-1.6.43.tar.gz
        tar -xzf libpng-1.6.43.tar.gz
        cd libpng-1.6.43
        ./configure --host=x86_64-w64-mingw32 \
          --prefix=/usr/x86_64-w64-mingw32 \
          --disable-shared \
          --enable-static
        make -j$(nproc)
        sudo make install
        ls /usr/x86_64-w64-mingw32/include/png.h
        ls /usr/x86_64-w64-mingw32/lib/libpng*.a

    - name: Configure CMake for Windows Cross-compilation
      run: |
        cat > mingw-toolchain.cmake <<EOF
        set(CMAKE_SYSTEM_NAME Windows)
        set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
        set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
        set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
        set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBoost_ROOT=/usr/x86_64-w64-mingw32 \
              -DBoost_INCLUDE_DIR=/usr/x86_64-w64-mingw32/include \
              -DBoost_LIBRARY_DIR=/usr/x86_64-w64-mingw32/lib \
              -DPNG_ROOT=/usr/x86_64-w64-mingw32 \
              -DPNG_INCLUDE_DIR=/usr/x86_64-w64-mingw32/include \
              -DPNG_LIBRARY=/usr/x86_64-w64-mingw32/lib/libpng.a

    - name: Build
      run: |
        sed -i '1i #include <cstdint>' src/dyuv.h
        cmake --build build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CD-i-Extract-Windows
        path: |
          build/*.exe
          build/src/*.exe
