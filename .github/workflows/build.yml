name: Build Windows EXE (Cross-compile from Linux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW-w64 and Boost for MinGW
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake
        # Instala os headers e bibliotecas do Boost para o alvo MinGW-w64
        sudo apt-get install -y libboost-all-dev:amd64 # Tenta instalar a versão nativa primeiro
        # O pacote específico para MinGW pode ter outro nome. Vamos tentar o mais comum:
        sudo apt-get install -y mingw-w64-dev || true
        # Se o acima falhar, tentamos compilar o Boost do zero (mais demorado, mas garantido)
        # Vamos usar a abordagem de instalar via apt, que é mais rápida.

    - name: Configure CMake for Windows Cross-compilation
      run: |
        cat > mingw-toolchain.cmake <<EOF
        set(CMAKE_SYSTEM_NAME Windows)
        set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
        set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
        set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
        set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF
        # Força o CMake a procurar o Boost no diretório do MinGW
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBoost_ROOT=/usr/x86_64-w64-mingw32 \
              -DBoost_INCLUDE_DIR=/usr/x86_64-w64-mingw32/include

    - name: Build
      run: cmake --build build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CD-i-Extract-Windows
        path: |
          build/*.exe
          build/src/*.exe
