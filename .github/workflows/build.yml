name: Build Windows EXE (MinGW)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW via Chocolatey
      run: choco install mingw -y

    - name: Configure CMake with MinGW
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

    - name: Build with CMake
      run: cmake --build build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CD-i-Extract-Windows-MinGW
        # O executável gerado pelo MinGW geralmente fica diretamente na pasta build
        path: build/*.exe
