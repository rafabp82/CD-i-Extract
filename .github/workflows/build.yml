name: Build Windows EXE (CMake C++)

on:
  workflow_dispatch: # Permite disparar manualmente

jobs:
  build:
    runs-on: windows-latest # Máquina Windows com Visual Studio e MSVC

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      # Cria a pasta 'build', define a arquitetura x64 e o modo Release
      run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build with CMake
      # Compila o projeto usando a configuração Release
      run: cmake --build build --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CD-i-Extract-Windows
        # O CMake no Windows (com Visual Studio) geralmente coloca o .exe na pasta Release
        path: build/Release/CD-i-Extract.exe
